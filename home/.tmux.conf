# Remap prefix to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits (LazyVim-style: | for vertical, - for horizontal)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation with hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with arrow keys
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# Start windows/panes at 1
set -g base-index 1
setw -g pane-base-index 1

# No escape delay (critical for Neovim)
set -sg escape-time 0

# Enable mouse (needed for scroll passthrough to apps like Claude Code)
set -g mouse on

# Pane borders: peach active, dim inactive (Catppuccin Mocha)
set -g pane-border-style fg=#383838
set -g pane-active-border-style fg=#888888

# Pane labels: show command name on each pane's border
set -g pane-border-status top
set -g pane-border-format ' #{?#{pane_active},#[fg=#d08770]#[bold],#[fg=#383838]}󰆍 #{s/^[0-9][0-9.]*$/claude/:pane_current_command} '

# Status bar: Catppuccin Mocha accents on neutral dark
set -g status-style 'bg=#222222 fg=#cdd6f4'
set -g status-left ' #[fg=#89b4fa]󰀻 #S #[fg=#313244]· #[fg=#a6e3a1]󰉋 #{pane_current_path} #[fg=#313244]· '
set -g status-left-length 120
set -g status-right ''
set -g window-status-separator ''
set -g window-status-format '#[fg=#585b70] 󰖲 #I · #{s/^[0-9][0-9.]*$/claude/:pane_current_command} '
set -g window-status-current-format '#[fg=#cba6f7,bold] 󰖲 #I · #{s/^[0-9][0-9.]*$/claude/:pane_current_command} '
