# Remap prefix to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits (LazyVim-style: | for vertical, - for horizontal)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation with hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with arrow keys
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# Start windows/panes at 1
set -g base-index 1
setw -g pane-base-index 1

# No escape delay (critical for Neovim)
set -sg escape-time 0

# Enable mouse (needed for scroll passthrough to apps like Claude Code)
set -g mouse on

# Pane borders: burnt orange active, dim inactive
set -g pane-border-style fg=#383838
set -g pane-active-border-style fg=#606060

# Pane labels: show command name on each pane's border
set -g pane-border-status top
set -g pane-border-format ' #{?#{pane_active},#[fg=#d08770]#[bold],#[fg=#383838]}󰆍 #{s/^[0-9][0-9.]*$/claude/:pane_current_command} '

# Status bar: Nord accents on neutral dark (Cursor Dark theme)
set -g status-style 'bg=#222222 fg=#d8dee9'
set -g status-left ' #[fg=#81a1c1]󰀻 #S #[fg=#3a3a3a]· #[fg=#ebcb8b]󰉋 #{pane_current_path} #[fg=#3a3a3a]· '
set -g status-left-length 120
set -g status-right ''
set -g window-status-separator ''
set -g window-status-format '#[fg=#505050] 󰖲 #I · #{s/^[0-9][0-9.]*$/claude/:pane_current_command} '
set -g window-status-current-format '#[fg=#b48ead,bold] 󰖲 #I · #{s/^[0-9][0-9.]*$/claude/:pane_current_command} '
